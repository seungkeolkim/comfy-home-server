<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>스타일 구성 · Comfy Home</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style-preview/preview.css" />
    <link rel="stylesheet" href="/workspace-shell.css" />
    <script src="/workspace-shell.js" defer></script>
    <script src="/workflow-options.js" defer></script>
    <script src="/image-preview.js" defer></script>
    <script src="/style-preview/project-persistence.js" defer></script>
    <script src="/style-preview/style-project-forks.js" defer></script>
    <script src="/style-preview/style-generation.js" defer></script>
    <script src="/style-preview/style-voting.js" defer></script>
    <script src="/style-preview/style-evolution.js" defer></script>
    <script src="/style-preview/style-comparison.js" defer></script>
    <script src="/style-preview/style-library.js" defer></script>
    <script src="/style-preview/style-favorites.js" defer></script>
    <script src="/style-preview/style-lora-presets.js" defer></script>
    <script src="/style-preview/settings-preview.js" defer></script>
    <script src="/style-preview/style-component-statistics.js" defer></script>
    <script src="/style-preview/ranking-preview.js" defer></script>
    <script src="/style-preview/preview.js" defer></script>
  </head>
  <body class="style-workspace">
    <div id="preview-application" class="workspace-application" hidden>
      <aside id="style-workspace-sidebar" class="workspace-sidebar" aria-label="스타일 작업 공간">
        <a class="workspace-brand" href="#projects" aria-label="Comfy Home 스타일 프로젝트">
          <span class="workspace-brand-mark">CH</span>
          <span><strong>Comfy Home</strong><small>SERVER</small></span>
        </a>
        <nav id="preview-sidebar" class="sidebar" aria-label="스타일 메뉴">
          <button type="button" data-action="navigate" data-screen="projects">▦　프로젝트</button>
          <button type="button" data-action="navigate" data-screen="global-settings">◎　글로벌 설정</button>
        </nav>
        <div class="workspace-sidebar-bottom">
          <div id="workspace-connection-status" class="workspace-connection"><span class="workspace-status-dot"></span><span>연결 확인 중</span></div>
          <button id="workspace-logout-button" type="button" data-workspace-logout>로그아웃</button>
        </div>
      </aside>
      <div class="workspace-main">
        <header class="workspace-topbar">
          <div><p class="eyebrow">YOUR CREATIVE SPACE</p><h1 id="workspace-page-title">스타일 구성</h1></div>
          <div class="workspace-topbar-right">
            <span id="workspace-active-count" class="workspace-active-count">프로젝트 0</span>
            <button id="workspace-refresh-button" type="button">새로고침</button>
            <button class="phase-badge" type="button" data-action="navigate" data-screen="project-settings">설정</button>
            <button class="workspace-mobile-account" type="button" data-workspace-logout aria-label="Comfy Home 로그아웃">로그아웃</button>
          </div>
        </header>
        <nav class="workspace-switch" aria-label="작업 공간">
          <a id="general-workspace-link" href="/" title="현재 창에서 일반 생성으로 전환합니다.">일반 생성</a>
          <a href="/style" data-workspace-style aria-current="page">스타일 구성</a>
        </nav>
        <div class="preview-notice" hidden><span class="notice-dot"></span><strong>화면 미리보기</strong><span>예시만 바뀌며, 이 탭에 임시 보관됩니다.</span><a href="#scope">현재 범위·남은 구현</a></div>
        <div id="project-context" class="project-context"></div>
        <main id="preview-content" tabindex="-1"></main>
      </div>
      <nav id="preview-mobile-navigation" class="mobile-navigation" aria-label="스타일 메뉴"></nav>
    </div>
    <dialog id="component-dialog" class="component-dialog" aria-labelledby="component-dialog-title"></dialog>
    <dialog id="style-project-fork-dialog" class="component-dialog" aria-labelledby="style-project-fork-title"></dialog>
    <dialog id="illustration-dialog" class="illustration-dialog" aria-label="예시 이미지 확대"></dialog>
    <dialog id="settings-defaults-dialog" class="settings-defaults-dialog" aria-labelledby="settings-defaults-title"></dialog>
    <dialog id="style-generation-dialog" class="style-generation-dialog" aria-labelledby="style-generation-dialog-title"></dialog>
    <dialog id="style-generation-confirmation-dialog" class="generation-confirmation-dialog" aria-labelledby="style-generation-confirmation-title"></dialog>
    <div id="preview-toast" class="toast" role="status" hidden></div>
  </body>
</html>
