<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>스타일 구성 · Phase 0 · Comfy Home</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style-preview/preview.css" />
    <script src="/style-preview/preview.js" defer></script>
  </head>
  <body>
    <section id="preview-login" class="login-layout" hidden>
      <form id="preview-login-form" class="panel login-panel">
        <span class="brand-icon">S.</span>
        <p class="eyebrow">COMFY HOME</p>
        <h1>스타일 구성</h1>
        <p class="muted">Home Server 비밀번호로 들어오세요.</p>
        <label for="preview-password">비밀번호</label>
        <input id="preview-password" type="password" autocomplete="current-password" required />
        <button class="primary" type="submit">들어가기</button>
        <p id="preview-login-error" class="error" role="alert"></p>
      </form>
    </section>
    <div id="preview-application" hidden>
      <header class="application-header">
        <a class="brand" href="#projects" aria-label="Comfy Home 스타일 프로젝트"><span class="brand-icon">S.</span><span>Comfy Home<small>나만의 그림체 찾기</small></span></a>
        <nav class="workspace-tabs" aria-label="작업 공간"><a id="general-workspace-link" href="/">일반 생성</a><span aria-current="page">스타일 구성</span></nav>
        <span class="phase-badge">Phase 0</span>
      </header>
      <div class="preview-notice"><span class="notice-dot"></span><strong>화면 미리보기</strong><span>예시만 바뀌며, 이 탭에 임시 보관됩니다.</span><a href="#scope">현재 범위·남은 구현</a></div>
      <div id="project-context" class="project-context"></div>
      <div class="application-layout">
        <aside id="preview-sidebar" class="sidebar" aria-label="스타일 메뉴"></aside>
        <main id="preview-content" tabindex="-1"></main>
      </div>
      <nav id="preview-mobile-navigation" class="mobile-navigation" aria-label="스타일 메뉴"></nav>
    </div>
    <dialog id="component-dialog" class="component-dialog" aria-labelledby="component-dialog-title"></dialog>
    <dialog id="illustration-dialog" class="illustration-dialog" aria-label="예시 이미지 확대"></dialog>
    <div id="preview-toast" class="toast" role="status" hidden></div>
  </body>
</html>
